# Originally auto-generated by the Firebase CLI (firebase init hosting:github),
# hand-fixed twice now:
#  1. 2026-08-30 - shipped without a pnpm setup step at all - "pnpm install"
#     failed with "command not found" on a real push. ubuntu-latest has Node
#     but not pnpm; pnpm/action-setup has to run before actions/setup-node so
#     setup-node's pnpm cache option has something to find.
#  2. 2026-09-05 - the service-account-key deploy path (FirebaseExtended/
#     action-hosting-deploy@v0 + firebaseServiceAccount) is blocked by a Google
#     Workspace org policy (iam.disableServiceAccountKeyCreation) on this
#     project, inherited when jerrylockard-website moved under the lockard.me
#     Workspace account - "Key creation is not allowed on this service
#     account." Switched to a direct CLI deploy authenticated with
#     FIREBASE_TOKEN (firebase login:ci), which doesn't need a key at all.
#     This is a stopgap, not the final answer - see docs/CHANGELOG.md's
#     2026-09-05 entry. Workload Identity Federation is the real fix (no
#     long-lived secret, doesn't hit the org policy either) and is its own
#     follow-up task.
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm build
      - run: npx firebase-tools@latest deploy --only hosting --project jerrylockard-website --non-interactive
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
