# Originally auto-generated by the Firebase CLI (firebase init hosting:github),
# hand-fixed alongside firebase-hosting-merge.yml for the same missing pnpm
# setup step. Runs on PRs (e.g. a Dependabot bump — the one kind of PR this
# repo's own rules allow), not something this project uses day to day.
name: Deploy to Firebase Hosting on PR
on: pull_request
permissions:
  checks: write
  contents: read
  pull-requests: write
jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JERRYLOCKARD_SITE }}
          projectId: jerrylockard-site
