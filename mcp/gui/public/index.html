<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Site agents</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <h1>Site agents</h1>
    <div id="personas" class="personas"></div>
    <div id="approvals" class="approvals"></div>
  </aside>
  <main class="chat">
    <div id="log" class="log"></div>
    <form id="composer" class="composer">
      <textarea id="input" placeholder="Ask the selected agent to do something…" rows="2"></textarea>
      <button type="submit">Send</button>
    </form>
  </main>
</div>
<script type="module" src="/app.js"></script>
</body>
</html>
