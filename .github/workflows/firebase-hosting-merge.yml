# Originally auto-generated by the Firebase CLI (firebase init hosting:github),
# hand-fixed after it shipped without a pnpm setup step at all — "pnpm install"
# failed with "command not found" on a real push (2026-08-30). ubuntu-latest
# has Node but not pnpm; pnpm/action-setup has to run before actions/setup-node
# so setup-node's pnpm cache option has something to find.
name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile && pnpm build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JERRYLOCKARD_WEBSITE }}
          channelId: live
          projectId: jerrylockard-website
